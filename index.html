.gxc.dn .gxt b{color:var(--mut)}
.gxh{display:flex;align-items:center;gap:10px}
.gi{flex:none;width:38px;height:38px;border-radius:50%;background:var(--gc);color:#fff;display:flex;align-items:center;justify-content:center}
.gxt{flex:1;min-width:0}.gxt b{display:block;font-size:1.02rem;line-height:1.5;overflow-wrap:anywhere;color:var(--tx)}.gxt small{color:var(--mut);font-size:.78rem;line-height:1.6;display:block}
.gxp{font-weight:800;font-size:1.1rem;color:var(--tx)}
.gxc .bar{margin:8px 0;height:10px}.gxc .bar i{background:var(--gc)}
.gxm{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.gxm .ch{display:inline-flex;gap:4px;align-items:center;background:color-mix(in srgb,var(--gc) 18%,var(--card))}
.gxm .ch.ok{background:color-mix(in srgb,#15803d 24%,var(--card))}.gxm .ch.warn{background:color-mix(in srgb,#b45309 28%,var(--card))}.gxm .ch.bad{background:color-mix(in srgb,#b91c1c 26%,var(--card))}
.gl2{font-size:.88rem;line-height:1.8;margin:4px 0;color:var(--tx)}.gl2 small{color:var(--mut);font-weight:700}
.gxk{margin:8px 0;padding:8px 10px;border-radius:14px;background:color-mix(in srgb,var(--gc) 9%,var(--card))}
.gkh{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;font-weight:700;color:var(--tx)}
.gxk .bar{height:7px;margin:6px 0}
.gkc{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gkc input[type=number]{width:100px;padding:6px 8px;text-align:center}
.gkc input[type=range]{flex:1;min-width:140px;accent-color:var(--gc)}
.gst{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:.92rem;color:var(--tx);flex-wrap:wrap}
.gst input{width:20px;height:20px;accent-color:var(--gc);flex:none}
.gst.nx{font-weight:800}
.gst.dn span{text-decoration:line-through;color:var(--mut)}
.nxl{font-style:normal;font-size:.72rem;font-weight:800;padding:0 9px;border-radius:99px;background:var(--gc);color:#fff;line-height:1.7}
.gact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.gact .b{display:inline-flex;align-items:center;gap:5px;font-size:.82rem}
.gfm{background:var(--card);border-radius:18px;padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:8px;border:2px solid var(--c-g)}
.gfm input[type=date]{font:inherit;font-size:16px;padding:9px 10px;border-radius:14px;border:0;background:var(--fld);color:var(--tx);min-width:150px}
.gkr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gkr input:first-child{grid-column:1/-1}
.gck{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--tx)}.gck input{width:20px;height:20px;accent-color:var(--c-g)}
.gsm{display:flex;gap:6px;flex-wrap:wrap}.gsm .ch{color:var(--mut)}.gsm .ch.on{color:var(--tx);font-weight:700;background:color-mix(in srgb,var(--c-g) 30%,var(--card))}
.gr{background:color-mix(in srgb,var(--cc) 9%,var(--card));border-radius:16px;padding:10px 12px;margin-top:12px}
.gr textarea{min-height:64px;margin-top:6px}
.grt{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.grt .b.on{background:var(--c-g);color:#fff}
.gold{font-size:.8rem;color:var(--mut);margin-top:6px;line-height:1.7}

:root{--vzc:#14213D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--vzc:#FCA311}}
:root[data-theme="dark"]{--vzc:#FCA311}
.hero{position:relative}
.fx3{position:absolute;top:8px;left:10px;width:64px;height:64px;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
@media(min-width:700px){.fx3{left:50%;top:50%;width:104px;height:104px;transform:translate(-50%,-50%)}}
.fx3 canvas{width:100%;height:100%;display:block}
.vz{width:100%;max-width:560px;margin:6px auto 0}
.vz svg{width:100%;height:auto;display:block;overflow:visible}
.vz text{fill:var(--tx);font-family:inherit}
.vz text.m{fill:var(--mut)}
.vz text.h{paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.nofx .vzw{display:none}
.vzl{display:flex;align-items:center;justify-content:center;gap:4px;font-size:.75rem;color:var(--mut);margin-top:6px}
.vzl i{width:14px;height:14px;border-radius:4px;display:inline-block}
.dt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.grw{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grw .vz{width:116px;margin:0}
@media(prefers-reduced-motion:reduce){.fx3{filter:none}}

.hero{flex-direction:column;justify-content:center;text-align:center;gap:6px;padding:16px 18px 12px}
.hl{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.hlogo{width:40px;height:40px}
.hmain{display:flex;flex-direction:column;align-items:center;gap:0;width:100%}
.hrow{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.5vw,10px);width:100%}
.hero .orn{width:clamp(30px,9vw,92px);height:auto;flex:none;color:var(--gold)}
.orn.m{transform:scaleX(-1)}
.bsm{font-family:"Aref Ruqaa Ink","Aref Ruqaa",Amiri,"Noto Naskh Arabic","Traditional Arabic",serif;font-weight:700;font-size:clamp(1.3rem,4.8vw,1.9rem);line-height:1.6;color:var(--gold);text-shadow:0 2px 12px rgba(252,163,17,.3)}
.hero h1{font-family:"Aref Ruqaa Ink","Aref Ruqaa",Amiri,"Noto Naskh Arabic","Traditional Arabic",serif;font-weight:700;font-size:clamp(2.2rem,8.5vw,3.5rem);line-height:1.35;margin:0;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.28),0 0 24px rgba(252,163,17,.35)}
.hj{font-family:"Aref Ruqaa","Aref Ruqaa Ink",Amiri,"Noto Naskh Arabic",serif;font-weight:700;font-size:clamp(.85rem,3vw,1.2rem);margin:0;color:var(--gold);white-space:nowrap}
.hero .tools{justify-content:center;margin-top:2px}
@media(min-width:700px){.hlogo{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:64px;height:64px}.fx3{left:28px;top:50%;width:96px;height:96px;transform:translateY(-50%)}}
@media(max-width:699px){.fx3{display:none}}

.bsm{font-family:"KafRuqaa","Aref Ruqaa",Amiri,"Noto Naskh Arabic","Traditional Arabic",serif;font-weight:400;font-size:clamp(1.7rem,6.4vw,2.5rem);line-height:1.6;color:#FFC857;-webkit-text-stroke:0;text-shadow:0 1px 10px rgba(0,0,0,.45)}
.hero h1{font-family:"KafRuqaa","Aref Ruqaa",Amiri,"Noto Naskh Arabic","Traditional Arabic",serif;font-weight:400;font-size:clamp(2.7rem,10.5vw,4.4rem);line-height:1.35;margin:0;color:#FFFFFF;-webkit-text-stroke:0;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.hj{font-family:"KafRuqaa","Aref Ruqaa",Amiri,"Noto Naskh Arabic",serif;font-weight:400;font-size:clamp(1.2rem,4.4vw,1.7rem);line-height:1.6;margin:0;color:#FFD98A;-webkit-text-stroke:0;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.hero .orn{color:#FFC857}
@media(max-width:560px){.hero .orn{width:clamp(18px,5.5vw,40px)}.hrow{gap:4px}}
.ch.tb{border:0;cursor:pointer;display:inline-flex;gap:5px;align-items:center;font:inherit;font-size:.8rem;color:var(--tx);touch-action:manipulation;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cc,var(--c-c)) 55%,transparent)}
.ch.tb:hover,.ch.tb[aria-expanded=true]{background:var(--cc,var(--c-c));color:var(--ct,#fff)}
@media(pointer:coarse){.ch.tb{padding:6px 12px}}
.tmw{margin:2px 10px 8px;padding:8px 10px;border-radius:14px;background:color-mix(in srgb,var(--cc,var(--c-c)) 12%,var(--card))}
.tpk{display:inline-flex;gap:3px;align-items:center;direction:ltr}.tpk select{padding:7px 6px;font-size:16px;min-width:0}

/* ===== ورقة اليوم للطباعة (A4) ===== */
#prv{position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.78);overflow:auto;padding:10px 12px 24px;display:none;flex-direction:column;align-items:center;gap:10px}
body.prOn{overflow:hidden}
.prtb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;position:sticky;top:0;z-index:2;background:rgba(15,23,42,.92);padding:8px 10px;border-radius:14px}
.prtb .st{color:#e2e8f0;flex-basis:100%;text-align:center}
.prtb .b[aria-pressed=true]{background:var(--gold);color:#14213d}
.prw{position:relative;overflow:hidden;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.45);flex:none}
.pa4{position:absolute;left:0;top:0;transform-origin:0 0;width:210mm;height:296mm;box-sizing:border-box;padding:6mm 7mm 5mm;background:#fff;color:#111827;direction:rtl;text-align:right;display:flex;flex-direction:column;gap:2mm;overflow:hidden;font-size:calc(7.6pt*var(--pz,1));line-height:1.38;font-family:Tajawal,"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pa4 *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pa4>*{flex:none}
.pa4 .ph{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4mm;background:#14213d;color:#fff;border-radius:3mm;padding:2.6mm 5mm;border-bottom:.9mm solid #fca311}
.pa4 .phd{font-family:"KafRuqaa","Aref Ruqaa",Amiri,serif;font-size:2.35em;line-height:1.15;color:#fca311}
.pa4 .phs{font-size:1.12em;color:#e5e7eb}
.pa4 .phc{text-align:center}.pa4 .phb{font-family:"KafRuqaa","Aref Ruqaa",Amiri,serif;font-size:1.7em;color:#fca311;line-height:1.3}
.pa4 .pht{font-size:1em;letter-spacing:.02em;color:#cbd5e1}
.pa4 .phl{text-align:left;direction:rtl}.pa4 .phl .phs{color:#fff}.pa4 .phn{display:inline-block;margin:.5mm 0 0 1mm;padding:.2mm 2mm;border-radius:5mm;background:#fca311;color:#14213d;font-weight:700;font-size:.95em}
.pa4 .pp{border:.3mm solid #cbd5e1;border-radius:2.4mm;padding:1.6mm 2.4mm}
.pa4 .ppg{display:grid;grid-template-columns:repeat(6,1fr);gap:1.6mm;text-align:center}
.pa4 .ppc{background:#f1f5f9;border-radius:2mm;padding:.8mm 0}.pa4 .ppc small{display:block;color:#475569;font-size:.95em}.pa4 .ppc b{display:block;font-size:1.5em;color:#14213d;line-height:1.2}
.pa4 .ppx{margin-top:1.1mm;color:#334155;font-size:.95em;text-align:center}.pa4 .ppx b{color:#14213d}.pa4 .ppx span{display:inline-block;margin:0 1.4mm}

let BASE=null,baseKey='';
const mgCanon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const mgEq=(a,b)=>a===b||mgCanon(a)===mgCanon(b);
const mgO=v=>v&&typeof v==='object'&&!Array.isArray(v);
const mgId=o=>o&&typeof o==='object'&&!Array.isArray(o)?(o.id!==undefined?'i'+o.id:(o.w!==undefined?'w'+o.w:undefined)):undefined;
function mg(b,l,r,lt,rt){
if(mgEq(l,r))return l;
if(mgEq(l,b))return r;
if(mgEq(r,b))return l;
if(mgO(l)&&mgO(r)){const o={},bb=mgO(b)?b:{};new Set(Object.keys(l).concat(Object.keys(r))).forEach(k=>{const v=mg(bb[k],l[k],r[k],lt,rt);if(v!==undefined)o[k]=v});return o}
if(Array.isArray(l)&&Array.isArray(r)){const all=l.concat(r);
if(all.length&&all.every(x=>mgId(x)!==undefined)){const bm={},lm={},rm={};(Array.isArray(b)?b:[]).forEach(x=>{const i=mgId(x);if(i!==undefined)bm[i]=x});l.forEach(x=>{lm[mgId(x)]=x});r.forEach(x=>{rm[mgId(x)]=x});

return lt>=rt?l:r}
