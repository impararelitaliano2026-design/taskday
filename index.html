function tmLeft(){return T.run?Math.max(0,Math.round((T.end-Date.now())/1000)):T.left}
function tmBuild(){const el=$('#tm');if(!T){el.style.display='none';return}el.style.display='flex';

el.innerHTML=`<b>${esc(ttl)}</b><span class="big" id="tmt"></span>${T.fin?'<span>انتهى الوقت</span>':`<button class="b" data-a="tmp">${T.run?'إيقاف':'استئناف'}</button>`}${p?`<button class="b" data-a="pomoskip">تخطي</button>${p.tid&&p.ph==='f'?'<button class="b" data-a="pomodone">خلصت المهمة</button>':''}`:''}<button class="b" data-a="tmx">✕</button>`;tmTick()}
function tmTick(){const e=$('#tmt');if(!e||!T)return;const l=tmLeft();e.textContent=pad(Math.floor(l/60))+':'+pad(l%60)}
setInterval(()=>{if(!T||!T.run)return;if(tmLeft()<=0&&T.pomo){pomoNext();return}if(tmLeft()<=0){T.run=false;T.left=0;T.fin=true;beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
if(T.id){S.v[T.dd+'|'+T.id]=true;touch(T.dd);render()}tmBuild()}else tmTick()},500);
